name: Build Android APK (Public Playtest)
on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK de Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el Repositorio
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android NDK y SDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.4

      - name: Inicializar Herramientas y Submódulos Lime
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib run lime setup flixel
          # Forzar la instalación de dependencias requeridas por las nuevas versiones
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install hscript-ex --quiet
          haxelib install hxvlc --quiet

      - name: Configurar Entorno Android en Lime
        run: |
          haxelib run lime setup android "${{ env.ANDROID_HOME }}" "${{ steps.setup-ndk.outputs.ndk-path }}" "${{ env.JAVA_HOME }}"

      - name: Compilar APK (Release)
        run: |
          haxelib run lime build android -release

      - name: Buscar y guardar APK final
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Playtest-Android
          path: |
            export/release/android/bin/app/build/outputs/apk/release/*.apk
            export/android/bin/app/build/outputs/apk/release/*.apk
